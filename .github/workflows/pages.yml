name: Publish Planly and KompensIQ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build UTF-8 website
        run: npm run build:pages
      - name: Install KompensIQ dependencies
        working-directory: kompensiq
        run: npm ci --no-audit --no-fund
      - name: Test KompensIQ calculations
        working-directory: kompensiq
        run: npm test
      - name: Build KompensIQ demo
        working-directory: kompensiq
        run: npm run build:pages
      - name: Include KompensIQ without replacing Planly
        run: mkdir -p dist/kompensiq && cp -R kompensiq/dist/. dist/kompensiq/
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
